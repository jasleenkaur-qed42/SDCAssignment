$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Banner
status: stable
group: Content
description: >-
  A hero banner with a heading, subheading, optional image and an optional
  slot for call-to-action buttons.
props:
  type: object
  required:
    - heading
  properties:
    heading:
      type: string
      title: Heading
      description: The main heading text for the banner.
      examples:
        - 'Build pages faster with Canvas'
    heading_level:
      type: string
      title: Heading level
      description: The HTML heading tag for the main heading.
      enum:
        - h1
        - h2
        - h3
      meta:enum:
        h1: 'Heading 1'
        h2: 'Heading 2'
        h3: 'Heading 3'
      default: h1
      examples:
        - h1
    subheading:
      type: string
      title: Subheading
      description: The subheading text for the banner.
      examples:
        - 'Reusable components, assembled visually.'
    image:
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      description: An optional image shown beside the text on wider screens.
slots:
  actions:
    title: Actions
    description: Optional call-to-action buttons shown under the subheading.
