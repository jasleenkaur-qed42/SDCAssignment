$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Button
status: stable
description: >-
  A button component that can be used to create buttons with different styles and behaviors.
props:
  type: object
  required:
    - label
  properties:
    label:
      type: string
      title: Button Label
      description: The text to display on the button.
      examples:
        - 'Default Button'
    url:
      type: string
      format: uri-reference
      title: Button URL
      description: The URL to link to when the button is clicked. Leave empty to render a plain button.
      examples:
        - 'https://www.example.com'
    variant:
      type: string
      title: Button Variant
      description: The visual style of the button.
      enum:
        - primary
        - secondary
        - tertiary
      meta:enum:
        primary: 'Primary'
        secondary: 'Secondary'
        tertiary: 'Tertiary'
      default: primary
      examples:
        - primary
